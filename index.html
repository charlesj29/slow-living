<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- A little pixel-art cottage with chimney smoke. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Slow Living · Charles</title>
    <!-- The loading screen's pixel font, fetched early so its first line already uses it. -->
    <link
      rel="preload"
      href="/fonts/pixelify-sans-500-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The first paint matches the loading screen (cream sky) before any script runs. -->
    <style>
      html {
        background: #fbeedd;
      }
    </style>
    <meta
      name="description"
      content="Charles Jonathan, software engineer (Flutter). An island portfolio you can walk around in: apps, experience and contact."
    />
    <meta name="theme-color" content="#1f4e79" />
    <!-- Link previews (WhatsApp, LinkedIn, Slack, X, …). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Charles Jonathan · Software Engineer (Flutter)" />
    <meta property="og:description" content="An island portfolio you can walk around in." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A pixel-art island with a village, a cottage, a lake and a workspace"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- portfolio:jsonld -->
  </head>
  <body>
    <div id="root"></div>
    <!-- The portfolio as plain HTML for search engines and visitors without JavaScript. -->
    <noscript><!-- portfolio:html --></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
